name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    name: Build Multiplatform Binaries
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Run Tests
      run: go test -v ./...

    - name: Build Windows Binary
      env:
        GOOS: windows
        GOARCH: amd64
      run: go build -ldflags="-s -w" -o bin/firewall.exe ./cmd/firewall

    - name: Build Linux Binary
      env:
        GOOS: linux
        GOARCH: amd64
      run: go build -ldflags="-s -w" -o bin/firewall-linux-amd64 ./cmd/firewall

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
      with:
        files: |
          bin/firewall.exe
          bin/firewall-linux-amd64
          bin/config.txt
          bin/whitelist.txt
          bin/blacklist.txt
          bin/optimize-vps.sh
        generate_release_notes: true
