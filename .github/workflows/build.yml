name: Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ created ]

jobs:
  build:
    name: Build Multiplatform Binaries
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Run Tests
      run: go test -v ./...

    - name: Build Windows Binary
      env:
        GOOS: windows
        GOARCH: amd64
      run: go build -ldflags="-s -w" -o bin/firewall.exe ./cmd/firewall

    - name: Build Linux Binary
      env:
        GOOS: linux
        GOARCH: amd64
      run: go build -ldflags="-s -w" -o bin/firewall-linux-amd64 ./cmd/firewall
